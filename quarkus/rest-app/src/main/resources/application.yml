quarkus:
  swagger-ui:
    always-include: true
  http:
    limits:
      # reject oversized bodies
      max-body-size: ${QUARKUS_HTTP_LIMITS_MAX_BODY_SIZE:25M}
    cors:
      ~: true
      methods: GET,POST,OPTIONS
      origins: "/.*/"
    port: 9000

  locales: en
  default-locale: en-US
  banner:
    path: "openepcis-banner.txt"

  ssl:
    native: true

mp:
  openapi:
    filter: "io.openepcis.resources.oas.EPCISExampleOASFilter"

# Schema validation configuration
validation:
  # Maximum number of errors before stopping validation early
  max-reported-errors: ${OPENEPCIS_MAX_REPORTED_ERRORS:1000}
  streaming: ${OPENEPCIS_VALIDATION_STREAMING:true}
